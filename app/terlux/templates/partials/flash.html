{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="border-b border-line bg-paper">
  <div class="shell flex flex-col gap-1 py-3">
    {% for category, message in messages %}
    <p class="flex items-center gap-3 text-[0.8125rem] {{ 'text-copper' if category == 'error' else 'text-ink-soft' }}">
      <span class="h-1 w-1 shrink-0 rounded-full {{ 'bg-copper' if category == 'error' else 'bg-ink' }}"></span>{{ message }}
    </p>
    {% endfor %}
  </div>
</div>
{% endif %}
{% endwith %}
