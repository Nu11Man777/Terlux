name: terlux

x-storage-image: &storage-image bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
x-client-image: &client-image bitnamilegacy/minio-client@sha256:00dcc4e58ada0df45bb7d9ee435af98295f96c27c3c68292ce78ec700a87b511

services:
  storage:
    image: *storage-image
    container_name: terlux-storage
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-terlux-ops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Tx9mPq2LvR4sKd81}
      MINIO_REGION: mx-central-1
      MINIO_SKIP_CLIENT: "yes"
    volumes:
      - storage-data:/bitnami/minio/data
    ports:
      - "${STORAGE_API_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: ./app
    image: terlux/web:1.0.0
    container_name: terlux-web
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-terlux-local-development}
      ASSETS_BASE_URL: ${ASSETS_BASE_URL:-http://assets.terlux.internal:9000}
      ASSETS_BUCKET: ${ASSETS_BUCKET:-terlux-assets}
      ASSETS_CATALOG_PREFIX: ${ASSETS_CATALOG_PREFIX:-public/catalog}
      SHIPPING_FLAT: ${SHIPPING_FLAT:-14900}
      FREE_SHIPPING_FROM: ${FREE_SHIPPING_FROM:-150000}
    ports:
      - "${WEB_PORT:-8000}:8000"

  mc:
    image: *client-image
    profiles:
      - ops
    environment:
      MC_HOST_myminio: http://${MINIO_ROOT_USER:-terlux-ops}:${MINIO_ROOT_PASSWORD:-Tx9mPq2LvR4sKd81}@${STORAGE_HOST:-storage}:9000
    entrypoint: ["mc"]

volumes:
  storage-data:
